<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Select organization | coyote-mcp</title><link rel="stylesheet" href="{{ url_for('static', path='console.css') }}"></head>
<body class="login-page"><main class="login-panel"><a class="brand" href="/">coyote-mcp</a><h1>Select organization</h1>{% if organizations %}<form method="post" action="{{ url_for('select_organization') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="organization_id">Organization</label><select id="organization_id" name="organization_id" required>{% for organization in organizations %}<option value="{{ organization.id }}">{{ organization.display_name }}</option>{% endfor %}</select><button type="submit">Continue</button></form>{% else %}<p>Your account has no enabled organization memberships.</p>{% endif %}</main></body></html>
