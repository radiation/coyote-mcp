[project]
name = "coyote-mcp"
version = "0.1.0"
description = "Collection-aware MCP gateway prototype"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115",
  "fastmcp>=3,<5",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.15",
  "pydantic>=2.10",
  "pydantic-settings>=2.8",
  "jsonschema>=4.26",
  "jinja2>=3.1",
  "authlib>=1.3",
  "itsdangerous>=2.2",
]

[project.scripts]
coyote-mcp = "coyote_mcp.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.13",
  "mypy>=1.18",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-cov>=7.1",
  "httpx>=0.28",
  "pre-commit>=4.0",
  "types-requests>=2.32",
  "types-jsonschema>=4.26",
  "aiosqlite>=0.22.1",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coyote_mcp"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["coyote_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres: requires a PostgreSQL database migrated by Alembic",
]

[tool.coverage.run]
branch = true
source = ["coyote_mcp"]
omit = [
  "tests/*",
  "alembic/*",
  "*/migrations/*",
  "*/generated/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = [
  "tests/*",
  "alembic/*",
  "*/migrations/*",
  "*/generated/*",
]
