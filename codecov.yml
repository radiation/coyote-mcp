coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 80%
        informational: true
  range: 80..100

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

github_checks:
  annotations: true

ignore:
  - "tests/**"
  - "alembic/**"
  - "**/generated/**"
