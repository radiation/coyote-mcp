name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: coyote_mcp
          POSTGRES_USER: coyote
          POSTGRES_PASSWORD: localdev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coyote -d coyote_mcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.6.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://coyote:localdev-only@localhost:5432/coyote_mcp
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        env:
          POSTGRES_INTEGRATION_URL: postgresql+asyncpg://coyote:localdev-only@localhost:5432/coyote_mcp
        run: >-
          uv run pytest
          --cov=coyote_mcp
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.6.0
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
