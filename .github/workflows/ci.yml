name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: coyote_mcp
          POSTGRES_USER: coyote
          POSTGRES_PASSWORD: localdev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coyote -d coyote_mcp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.6.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://coyote:localdev-only@localhost:5432/coyote_mcp
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        env:
          POSTGRES_INTEGRATION_URL: postgresql+asyncpg://coyote:localdev-only@localhost:5432/coyote_mcp
        run: >-
          uv run pytest
          --cov=coyote_mcp
          --cov-report=term-missing
          --cov-report=xml
          --junitxml=junit.xml

      - name: Publish test report
        if: ${{ always() && hashFiles('junit.xml') != '' }}
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: pytest
          path: junit.xml
          reporter: java-junit

      - name: Upload test reports
        if: ${{ always() && (hashFiles('coverage.xml') != '' || hashFiles('junit.xml') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.0
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != '' && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true

      - name: Summarize test reports
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          uv run python -c "from pathlib import Path; import os, xml.etree.ElementTree as ET; junit=Path('junit.xml'); coverage=Path('coverage.xml'); summary=['## Test and coverage report', f\"pytest: **{os.environ['TEST_OUTCOME']}**']; summary.extend([f\"Tests: **{sum(int(s.get('tests', '0')) for s in ET.parse(junit).iter('testsuite'))}** total; **{sum(int(s.get(k, '0')) for s in ET.parse(junit).iter('testsuite') for k in ('failures', 'errors'))}** failed\"] if junit.exists() else ['JUnit report was not generated.']); summary.extend([f\"Coverage: **{float(ET.parse(coverage).getroot().attrib['line-rate']) * 100:.2f}%** line coverage\"] if coverage.exists() else ['Coverage report was not generated.']); Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\\n\\n'.join(summary) + '\\n', encoding='utf-8')"

      - name: Fail when pytest fails
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1
